name: Build Ruralz Maths
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable
      - run: flutter create --platforms=android,web --project-name ruralz_maths .
      - name: Ensure Android Internet permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('android/app/src/main/AndroidManifest.xml')
          text = path.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET"/>\n'
          if permission not in text:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
              if marker not in text:
                  raise SystemExit('AndroidManifest.xml format changed; could not add INTERNET permission safely.')
              text = text.replace(marker, marker + '\n' + permission, 1)
              path.write_text(text)
          PY
          grep -n 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
      - run: rm -rf test
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter build apk --release
      - run: flutter build web --release
      - name: Package web app
        run: cd build && zip -r ruralz-maths-web.zip web
      - uses: actions/upload-artifact@v4
        with:
          name: ruralz-maths-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ruralz-maths-web
          path: build/ruralz-maths-web.zip
